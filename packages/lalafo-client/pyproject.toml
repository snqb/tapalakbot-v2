[project]
name = "lalafo-client"
version = "0.1.0"
description = "Standalone async Lalafo.kg API client with proxy & anti-bot infra"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28",
    "pydantic>=2.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
smartproxy = ["httpx[socks]"]
capsolver = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lalafo_client"]
