[project]
name = "tapalakbot"
version = "0.2.0"
description = "Intelligent Lalafo search agent — Telegram bot with pydantic-ai"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "httpx>=0.28",
    "pydantic-ai-slim[openrouter]>=1.80",
    "lalafo-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapalakbot"]

[tool.uv.sources]
lalafo-client = { workspace = true }
